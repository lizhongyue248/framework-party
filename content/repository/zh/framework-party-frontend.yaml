definitions:
  reactivity-group: &reactivity-group
    type: "group"
    name: "响应式"
    description: >
      响应式是框架检测页面上使用的数据何时发生变化(突变),并优化更新页面以反映这些变化的机制。
      因此,它是任何 Web 框架的关键机制,所以我们将分析它以了解其优势和局限性。
    detail-list:
      - "声明状态"
      - "更新状态"
      - "计算状态"

  templating: &templating
    type: "group"
    name: "模板"
    description: >
      模板指的是框架允许开发人员构建和渲染 UI 的方式。
      它包括如何创建类似 HTML 的结构、如何插入动态内容以及 UI 如何对数据变化做出反应。
    detail-list:
      - "最小模板"
      - "样式"
      - "循环"
      - "点击事件"
      - "DOM 引用"
      - "条件渲染"

  lifecycle: &lifecycle
    type: "group"
    name: "生命周期"
    description: >
      生命周期钩子是允许开发人员在组件生命周期的特定点运行代码的方法,
      例如在创建、更新或销毁组件时。理解这些钩子对于管理副作用和优化性能至关重要。
    detail-list:
      - "挂载时"
      - "卸载时"

  component-composition: &component-composition
    type: "group"
    name: "组件组合"
    description: >
      组件组合是现代前端框架中的一个基本概念。它涉及将 UI 分解为可重用的部分,
      并理解这些部分如何相互通信和协同工作以构建复杂的应用程序。
    detail-list:
      - "属性"
      - "向父组件发送事件"
      - "插槽"
      - "插槽后备内容"
      - "上下文"

  form-input: &form-input
    type: "group"
    name: "表单输入"
    description: >
      处理表单输入是 Web 应用程序中的常见任务。本节探讨不同框架如何
      管理表单状态、验证输入以及处理各种类型表单控件的用户交互。
    detail-list:
      - "文本输入"
      - "复选框"
      - "单选按钮"
      - "选择框"

  webapp-features: &webapp-features
    type: "group"
    name: "Web 应用功能"
    description: >
      本节涵盖了构建完整 Web 应用程序的基本功能,包括如何引导应用程序
      以及与外部数据源交互。
    detail-list:
      - "渲染应用"
      - "获取数据"

name: "前端"
repository: "https://github.com/lizhongyue248/framework-party-frontend"
code: "https://codesandbox.io/p/github/lizhongyue248/framework-party-frontend/main"
description: "这是一个前端框架。"
framework:
  - name: "React"
    description: "一个使用基于组件架构构建用户界面的JavaScript库。"
    version: "18.2.0"
    repository: "https://github.com/facebook/react"
    website: "https://reactjs.org"
    license: "MIT"
    logo: "/logo/framework-party-frontend/react.svg"
    feature:
      - <<: *reactivity-group
        detail:
          - name: "声明状态"
            description: "在React中，状态通常使用useState钩子声明。"
            link: "https://react.dev/reference/react/useState"
            file:
              - path: "apps/react-party/src/components/0-reactivity/0-declare-state/name.tsx"
                language: "tsx"
          - name: "更新状态"
            description: "在React中，可以通过useState返回的setter函数更新状态。"
            link: "https://react.dev/reference/react/useState#updating-state"
            file:
              - path: "apps/react-party/src/components/0-reactivity/1-update-state/update-count.tsx"
                language: "tsx"
          - name: "计算状态"
            description: "在React中，可以使用useMemo钩子创建计算值。"
            link: "https://react.dev/reference/react/useMemo"
            file:
              - path: "apps/react-party/src/components/0-reactivity/2-computed-state/double-count.tsx"
                language: "tsx"
      - <<: *templating
        detail:
          - name: "简约模板"
            description: "React使用JSX, 这是一种语法扩展，让你可以在JavaScript中编写类似HTML的代码。"
            link: "https://react.dev/learn/writing-markup-with-jsx"
            file:
              - path: "apps/react-party/src/components/1-templating/0-minimal-template/hello-world.tsx"
                language: "tsx"
          - name: "样式"
            description: "React组件可以使用CSS模块或内联样式。"
            link: "https://react.dev/learn/adding-interactivity#responding-to-events"
            file:
              - path: "apps/react-party/src/components/1-templating/1-styling/styling.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/1-templating/1-styling/style.css"
                language: "css"
          - name: "循环"
            description: "在React中，可以使用map函数渲染元素列表。"
            link: "https://react.dev/learn#rendering-lists"
            file:
              - path: "apps/react-party/src/components/1-templating/2-loop/count-list.tsx"
                language: "tsx"
          - name: "事件点击"
            description: "React通过类似onClick的属性处理事件。"
            link: "https://react.dev/learn/adding-interactivity#responding-to-events"
            file:
              - path: "apps/react-party/src/components/1-templating/3-event-click/count-increment.tsx"
                language: "tsx"
          - name: "dom引用"
            description: "React提供useRef钩子来创建对DOM元素的引用。"
            link: "https://react.dev/learn/manipulating-the-dom-with-refs"
            file:
              - path: "apps/react-party/src/components/1-templating/4-dom-ref/focus-input.tsx"
                language: "tsx"
          - name: "条件渲染"
            description: "在React中，可以使用三元运算符或&&运算符进行简单条件渲染。"
            link: "https://react.dev/learn/conditional-rendering"
            file:
              - path: "apps/react-party/src/components/1-templating/5-conditional/level-display.tsx"
                language: "tsx"
      - <<: *lifecycle
        detail:
          - name: "挂载时"
            description: "React使用useEffect钩子和空依赖数组在组件挂载时运行代码。"
            link: "https://react.dev/reference/react/useEffect#running-an-effect-only-when-the-component-mounts"
            file:
              - path: "apps/react-party/src/components/2-lifecycle/0-on-mount/page-title.tsx"
                language: "tsx"
          - name: "卸载时"
            description: "React使用useEffect返回的清理函数在组件卸载时运行代码。"
            link: "https://react.dev/reference/react/useEffect#cleaning-up-an-effect"
            file:
              - path: "apps/react-party/src/components/2-lifecycle/1-on-unmount/time.tsx"
                language: "tsx"
      - <<: *component-composition
        detail:
          - name: "属性"
            description: "React组件可以通过属性从父组件接收数据。"
            link: "https://react.dev/learn/passing-props-to-a-component"
            file:
              - path: "apps/react-party/src/components/3-component-composition/0-props/count-content.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/0-props/count-display.tsx"
                language: "tsx"
          - name: "向父组件发射事件"
            description: "React组件可以调用作为props传递的函数，与父组件进行通信。"
            link: "https://react.dev/learn/responding-to-events#passing-event-handlers-as-props"
            file:
              - path: "apps/react-party/src/components/3-component-composition/1-emit-to-parent/count-action.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/1-emit-to-parent/count-content.tsx"
                language: "tsx"
          - name: "插槽"
            description: "React使用children属性实现类似插槽的功能。"
            link: "https://react.dev/learn/passing-props-to-a-component#passing-jsx-as-children"
            file:
              - path: "apps/react-party/src/components/3-component-composition/2-slot/button-content.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/2-slot/custom-button.tsx"
                language: "tsx"
          - name: "插槽回退"
            description: "在React中，可以使用条件渲染为插槽提供默认内容。"
            link: "https://react.dev/learn/conditional-rendering"
            file:
              - path: "apps/react-party/src/components/3-component-composition/3-slot-fallback/app.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/3-slot-fallback/card.tsx"
                language: "tsx"
          - name: "上下文"
            description: "React提供Context API以便不通过props将数据传递给组件树。"
            link: "https://react.dev/learn/passing-data-deeply-with-context"
            file:
              - path: "apps/react-party/src/components/3-component-composition/4-context/app-context.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/4-context/theme-context.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/4-context/theme-toggle.tsx"
                language: "tsx"
      - <<: *form-input
        detail:
          - name: "输入文本"
            description: "React通过使用value和onChange属性的受控组件处理表单输入。"
            link: "https://react.dev/reference/react-dom/components/input"
            file:
              - path: "apps/react-party/src/components/4-form-input/0-input-text/input-text.tsx"
                language: "tsx"
          - name: "复选框"
            description: "在React中，复选框与其他表单输入项类似，使用checked属性。"
            link: "https://react.dev/reference/react-dom/components/input#checkbox"
            file:
              - path: "apps/react-party/src/components/4-form-input/1-checkbox/checkbox.tsx"
                language: "tsx"
          - name: "单选按钮"
            description: "在React中，单选按钮通过checked属性和onChange处理器进行管理。"
            link: "https://react.dev/reference/react-dom/components/input#radio"
            file:
              - path: "apps/react-party/src/components/4-form-input/2-radio/radio.tsx"
                language: "tsx"
          - name: "选择元素"
            description: "在React中，选择元素使用<select>和<option>标签，采用受控组件模式创建。"
            link: "https://react.dev/reference/react-dom/components/select"
            file:
              - path: "apps/react-party/src/components/4-form-input/3-select/select.tsx"
                language: "tsx"
      - <<: *webapp-features
        detail:
          - name: "渲染应用"
            description: "React应用通常使用ReactDOM.createRoot().render()进行渲染。"
            link: "https://react.dev/reference/react-dom/client/createRoot"
            file:
              - path: "apps/react-party/index.html"
                language: "html"
              - path: "apps/react-party/src/main.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/5-webapp-features/0-render-app/app.tsx"
                language: "tsx"
          - name: "获取数据"
            description: "在React中，可以使用useEffect钩子与Fetch API或像Axios这样的库获取数据。"
            link: "https://react.dev/learn/synchronizing-with-effects#fetching-data"
            file:
              - path: "apps/react-party/src/components/5-webapp-features/1-fetch-data/app.tsx"
                language: "tsx"

  - name: "Vue"
    description: "一个为构建用户界面而生的渐进式框架，核心库以渐进增强的方式设计。"
    version: "3.5.13"
    repository: "https://github.com/vuejs/vue"
    website: "https://vuejs.org"
    license: "MIT"
    logo: "/logo/framework-party-frontend/vue.svg"
    feature:
      - <<: *reactivity-group
        detail:
          - name: "声明状态"
            description: "在Vue 3中，响应式状态通常使用ref或reactive函数在setup函数或script setup中声明。"
            link: "https://vuejs.org/guide/essentials/reactivity-fundamentals.html"
            file:
              - path: "apps/vue-party/src/components/0-reactivity/0-declare-state/Name.vue"
                language: "vue"
          - name: "更新状态"
            description: "在Vue中，可以通过直接为ref赋新值或修改响应式对象来更新状态。"
            link: "https://vuejs.org/guide/essentials/reactivity-fundamentals.html#reactive-variables-with-ref"
            file:
              - path: "apps/vue-party/src/components/0-reactivity/1-update-state/UpdateCount.vue"
                language: "vue"
          - name: "计算状态"
            description: "在Vue中，可以使用computed函数创建计算属性。"
            link: "https://vuejs.org/guide/essentials/computed.html"
            file:
              - path: "apps/vue-party/src/components/0-reactivity/2-computed-state/DoubleCount.vue"
                language: "vue"
      - <<: *templating
        detail:
          - name: "简约模板"
            description: "Vue使用一种扩展HTML的模板语法，让你可以声明式地将渲染的DOM绑定到组件的数据。"
            link: "https://vuejs.org/guide/essentials/template-syntax.html"
            file:
              - path: "apps/vue-party/src/components/1-templating/0-minimal-template/HelloWorld.vue"
                language: "vue"
          - name: "样式"
            description: "Vue组件可以包含<style>部分，用于组件特定的CSS，并可选择性地对组件进行作用域限定。"
            link: "https://vuejs.org/api/sfc-css-features.html"
            file:
              - path: "apps/vue-party/src/components/1-templating/1-styling/Styling.vue"
                language: "vue"
          - name: "循环"
            description: "Vue提供v-for指令以根据数组渲染项目列表。"
            link: "https://vuejs.org/guide/essentials/list.html"
            file:
              - path: "apps/vue-party/src/components/1-templating/2-loop/CountList.vue"
                language: "vue"
          - name: "事件点击"
            description: "Vue使用v-on指令（或@简写）来监听DOM事件，并在事件触发时运行方法。"
            link: "https://vuejs.org/guide/essentials/event-handling.html"
            file:
              - path: "apps/vue-party/src/components/1-templating/3-event-click/CountIncrement.vue"
                language: "vue"
          - name: "dom引用"
            description: "Vue允许你通过ref属性和ref函数直接访问DOM元素。"
            link: "https://vuejs.org/guide/essentials/template-refs.html"
            file:
              - path: "apps/vue-party/src/components/1-templating/4-dom-ref/FocusInput.vue"
                language: "vue"
          - name: "条件渲染"
            description: "Vue提供v-if、v-else-if和v-else指令用于元素的条件渲染。"
            link: "https://vuejs.org/guide/essentials/conditional.html"
            file:
              - path: "apps/vue-party/src/components/1-templating/5-conditional/LevelDisplay.vue"
                language: "vue"
      - <<: *lifecycle
        detail:
          - name: "挂载时"
            description: "Vue 3使用onMounted接口在组件挂载后运行代码。"
            link: "https://vuejs.org/api/composition-api-lifecycle.html#onmounted"
            file:
              - path: "apps/vue-party/src/components/2-lifecycle/0-on-mount/PageTitle.vue"
                language: "vue"
          - name: "卸载时"
            description: "Vue 3使用onUnmounted接口在组件卸载时进行清理。"
            link: "https://vuejs.org/api/composition-api-lifecycle.html#onunmounted"
            file:
              - path: "apps/vue-party/src/components/2-lifecycle/1-on-unmount/Time.vue"
                language: "vue"
      - <<: *component-composition
        detail:
          - name: "属性"
            description: "在Vue中，属性通过组件的<script setup>部分中的defineProps宏声明。"
            link: "https://vuejs.org/guide/components/props.html"
            file:
              - path: "apps/vue-party/src/components/3-component-composition/0-props/App.vue"
                language: "vue"
              - path: "apps/vue-party/src/components/3-component-composition/0-props/CountContent.vue"
                language: "vue"
          - name: "向父组件发射事件"
            description: "子组件可以使用defineEmits宏和发射事件与父组件进行通信。"
            link: "https://vuejs.org/guide/components/events.html"
            file:
              - path: "apps/vue-party/src/components/3-component-composition/1-emit-to-parent/App.vue"
                language: "vue"
              - path: "apps/vue-party/src/components/3-component-composition/1-emit-to-parent/CountContent.vue"
                language: "vue"
          - name: "插槽"
            description: "Vue的插槽允许你将内容从父组件传输到子组件。"
            link: "https://vuejs.org/guide/components/slots.html"
            file:
              - path: "apps/vue-party/src/components/3-component-composition/2-slot/App.vue"
                language: "vue"
              - path: "apps/vue-party/src/components/3-component-composition/2-slot/ButtonContent.vue"
                language: "vue"
          - name: "插槽回退"
            description: "Vue中的插槽可以具有后备内容，当父组件未提供内容时显示这些内容。"
            link: "https://vuejs.org/guide/components/slots.html#fallback-content"
            file:
              - path: "apps/vue-party/src/components/3-component-composition/3-slot-fallback/App.vue"
                language: "vue"
              - path: "apps/vue-party/src/components/3-component-composition/3-slot-fallback/Card.vue"
                language: "vue"
          - name: "上下文"
            description: "Vue提供provide和inject函数，用于在不传递属性的情况下在组件之间共享数据。"
            link: "https://vuejs.org/guide/components/provide-inject.html"
            file:
              - path: "apps/vue-party/src/components/3-component-composition/4-context/App.vue"
                language: "vue"
              - path: "apps/vue-party/src/components/3-component-composition/4-context/ThemeContent.vue"
                language: "vue"
              - path: "apps/vue-party/src/components/3-component-composition/4-context/ThemedButton.vue"
                language: "vue"
              - path: "apps/vue-party/src/components/3-component-composition/4-context/ThemeProvider.ts"
                language: "typescript"
      - <<: *form-input
        detail:
          - name: "输入文本"
            description: "Vue提供v-model指令用于表单输入的双向数据绑定。"
            link: "https://vuejs.org/guide/components/v-model.html"
            file:
              - path: "apps/vue-party/src/components/4-form-input/0-input-text/InputText.vue"
                language: "vue"
          - name: "复选框"
            description: "Vue中的复选框可以通过v-model绑定布尔值或数组。"
            link: "https://vuejs.org/guide/form-input-bindings.html#checkbox"
            file:
              - path: "apps/vue-party/src/components/4-form-input/1-checkbox/Checkbox.vue"
                language: "vue"
          - name: "单选按钮"
            description: "Vue中的单选按钮可以分组并绑定到使用v-model的单个值。"
            link: "https://vuejs.org/guide/form-input-bindings.html#radio"
            file:
              - path: "apps/vue-party/src/components/4-form-input/2-radio/Radio.vue"
                language: "vue"
          - name: "选择元素"
            description: "Vue中的选择元素可以通过v-model绑定到值。"
            link: "https://vuejs.org/guide/form-input-bindings.html#select"
            file:
              - path: "apps/vue-party/src/components/4-form-input/3-select/Select.vue"
                language: "vue"
      - <<: *webapp-features
        detail:
          - name: "渲染应用"
            description: "在Vue 3中，通常在main.ts文件中使用createApp创建和挂载应用。"
            link: "https://vuejs.org/guide/essentials/application.html"
            file:
              - path: "apps/vue-party/index.html"
                language: "html"
              - path: "apps/vue-party/src/main.ts"
                language: "typescript"
              - path: "apps/vue-party/src/components/5-webapp-features/0-render-app/App.vue"
                language: "vue"
          - name: "获取数据"
            description: "在Vue中，可以在setup函数中或使用composition API获取数据。"
            link: "https://vuejs.org/guide/best-practices/production-deployment.html#fetching-data"
            file:
              - path: "apps/vue-party/src/components/5-webapp-features/1-fetch-data/App.vue"
                language: "vue"
              - path: "apps/vue-party/src/components/5-webapp-features/1-fetch-data/useFetchUser.ts"
                language: "typescript"
  - name: "Svelte"
    description: "一种构建用户界面的崭新方法，它将你的代码编译为小型、无框架的原声JS, 现包含用于细粒度反应的符文。"
    version: "5.28.1"
    repository: "https://github.com/sveltejs/svelte"
    website: "https://svelte.dev"
    license: "MIT"
    logo: "/logo/framework-party-frontend/svelte.svg"
    feature:
      - <<: *reactivity-group
        detail:
          - name: "声明状态"
            description: "在Svelte中，响应式状态在脚本部分通常使用let声明。"
            link: "https://svelte.dev/docs/svelte-components#script"
            file:
              - path: "apps/svelte-party/src/components/0-reactivity/0-declare-state/Name.svelte"
                language: "svelte"
          - name: "更新状态"
            description: "在Svelte中，可以通过直接为变量赋新值来更新状态。"
            link: "https://svelte.dev/docs/svelte-components#script"
            file:
              - path: "apps/svelte-party/src/components/0-reactivity/1-update-state/UpdateCount.svelte"
                language: "svelte"
          - name: "计算状态"
            description: "在Svelte中，计算值可以使用响应式声明($:)创建。"
            link: "https://svelte.dev/docs/svelte-components#script-3-$-marks-a-statement-as-reactive"
            file:
              - path: "apps/svelte-party/src/components/0-reactivity/2-computed-state/DoubleCount.svelte"
                language: "svelte"
      - <<: *templating
