definitions:
  reactivity-group: &reactivity-group
    type: "group"
    name: "响应式"
    description: >
      响应式是一种机制，它允许框架检测页面上使用的数据何时发生变化（被修改），
      并优化地更新页面以反映这些变化。因此，它是任何Web框架的关键机制，
      所以我们将对其进行分析以了解其优势和局限性。
    detail-list:
      - "声明状态"

name: "前端"
repository: "https://github.com/lizhongyue248/framework-party-frontend"
description: "这是前端框架。"
framework:
  - name: "React"
    description: "一个用于构建具有组件化架构的用户界面的JavaScript库。"
    version: "18.2.0"
    repository: "https://github.com/facebook/react"
    website: "https://reactjs.org"
    license: "MIT"
    logo: "https://reactjs.org/logo-og.png"
    feature:
      - <<: *reactivity-group
        detail:
          - name: "声明状态"
            description: "使用@RequestMapping将Web请求映射到特定的处理方法。"
            file:
              - path: "apps/react-party/src/components/reactivity/DeclareState.tsx"
                language: "typescript"
  - name: "Vue"
    description: "一个渐进式框架，用于构建具有易于接近的核心库的用户界面。"
    version: "3.3.4"
    repository: "https://github.com/vuejs/vue"
    website: "https://vuejs.org"
    license: "MIT"
