definitions:
  reactivity-group: &reactivity-group
    type: "group"
    name: "Reactivity"
    description: >
      Reactivity is the mechanism that allows the framework to detect when data used on the page is changed (mutated), 
      and to update the page optimally to reflect these changes. It is therefore a crucial mechanism for any web framework, 
      so we are going to analyze it to understand its strengths and limitations.
    detail-list:
      - "Declaring State"
      - "Updating State"
      - "Computed State"

  templating: &templating
    type: "group"
    name: "Templating"
    description: >
      Templating refers to the way a framework allows developers to structure and render the UI. 
      It includes how HTML-like structures are created, how dynamic content is inserted, and how the UI reacts to data changes.
    detail-list:
      - "Minimal Template"
      - "Styling"
      - "Loop"
      - "Event Click"
      - "Dom Ref"
      - "Conditional"

  lifecycle: &lifecycle
    type: "group"
    name: "Lifecycle"
    description: >
      Lifecycle hooks are methods that allow developers to run code at specific points in a component's life, 
      such as when it's created, updated, or destroyed. Understanding these hooks is crucial for managing side effects and optimizing performance.
    detail-list:
      - "On Mount"
      - "On Unmount"

  component-composition: &component-composition
    type: "group"
    name: "Component Composition"
    description: >
      Component composition is a fundamental concept in modern frontend frameworks. It involves breaking down the UI into reusable pieces, 
      and understanding how these pieces can communicate and work together to build complex applications.
    detail-list:
      - "Props"
      - "Emit to Parent"
      - "Slot"
      - "Slot Fallback"
      - "Context"

  form-input: &form-input
    type: "group"
    name: "Form Input"
    description: >
      Handling form inputs is a common task in web applications. This section explores how different frameworks 
      manage form state, validate input, and handle user interactions with various types of form controls.
    detail-list:
      - "Input Text"
      - "Checkbox"
      - "Radio"
      - "Select"

  webapp-features: &webapp-features
    type: "group"
    name: "Web App Features"
    description: >
      This section covers essential features for building full-fledged web applications, including how to bootstrap the application 
      and interact with external data sources.
    detail-list:
      - "Render App"
      - "Fetch Data"

name: "Frontend"
repository: "https://github.com/lizhongyue248/framework-party-frontend"
code: "https://codesandbox.io/p/github/lizhongyue248/framework-party-frontend/main"
description: "This is frontend framework."
framework:
  - name: "React"
    description: "A JavaScript library for building user interfaces with a component-based architecture."
    version: "18.2.0"
    repository: "https://github.com/facebook/react"
    website: "https://reactjs.org"
    license: "MIT"
    logo: "/logo/framework-party-frontend/react.svg"
    feature:
      - <<: *reactivity-group
        detail:
          - name: "Declaring State"
            description: "In React, state is typically declared using the useState hook."
            link: "https://react.dev/reference/react/useState"
            file:
              - path: "apps/react-party/src/components/0-reactivity/0-declare-state/name.tsx"
                language: "tsx"
          - name: "Updating State"
            description: "State in React can be updated using the setter function returned by useState."
            link: "https://react.dev/reference/react/useState#updating-state"
            file:
              - path: "apps/react-party/src/components/0-reactivity/1-update-state/update-count.tsx"
                language: "tsx"
          - name: "Computed State"
            description: "Computed values in React can be created using the useMemo hook."
            link: "https://react.dev/reference/react/useMemo"
            file:
              - path: "apps/react-party/src/components/0-reactivity/2-computed-state/double-count.tsx"
                language: "tsx"
      - <<: *templating
        detail:
          - name: "Minimal Template"
            description: "React uses JSX, a syntax extension that allows you to write HTML-like code within JavaScript."
            link: "https://react.dev/learn/writing-markup-with-jsx"
            file:
              - path: "apps/react-party/src/components/1-templating/0-minimal-template/hello-world.tsx"
                language: "tsx"
          - name: "Styling"
            description: "React components can be styled using CSS modules or inline styles."
            link: "https://react.dev/learn/adding-interactivity#responding-to-events"
            file:
              - path: "apps/react-party/src/components/1-templating/1-styling/styling.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/1-templating/1-styling/style.css"
                language: "css"
          - name: "Loop"
            description: "In React, you can use the map function to render lists of elements."
            link: "https://react.dev/learn#rendering-lists"
            file:
              - path: "apps/react-party/src/components/1-templating/2-loop/count-list.tsx"
                language: "tsx"
          - name: "Event Click"
            description: "React handles events using props like onClick for click events."
            link: "https://react.dev/learn/adding-interactivity#responding-to-events"
            file:
              - path: "apps/react-party/src/components/1-templating/3-event-click/count-increment.tsx"
                language: "tsx"
          - name: "Dom Ref"
            description: "React provides the useRef hook to create references to DOM elements."
            link: "https://react.dev/learn/manipulating-the-dom-with-refs"
            file:
              - path: "apps/react-party/src/components/1-templating/4-dom-ref/focus-input.tsx"
                language: "tsx"
          - name: "Conditional"
            description: "In React, you can use conditional rendering with ternary operators or && for simple conditions."
            link: "https://react.dev/learn/conditional-rendering"
            file:
              - path: "apps/react-party/src/components/1-templating/5-conditional/level-display.tsx"
                language: "tsx"
      - <<: *lifecycle
        detail:
          - name: "On Mount"
            description: "React uses the useEffect hook with an empty dependency array for running code on component mount."
            link: "https://react.dev/reference/react/useEffect#running-an-effect-only-when-the-component-mounts"
            file:
              - path: "apps/react-party/src/components/2-lifecycle/0-on-mount/page-title.tsx"
                language: "tsx"
          - name: "On Unmount"
            description: "React uses the cleanup function returned by useEffect for running code on component unmount."
            link: "https://react.dev/reference/react/useEffect#cleaning-up-an-effect"
            file:
              - path: "apps/react-party/src/components/2-lifecycle/1-on-unmount/time.tsx"
                language: "tsx"
      - <<: *component-composition
        detail:
          - name: "Props"
            description: "React components can receive data from their parent component through props."
            link: "https://react.dev/learn/passing-props-to-a-component"
            file:
              - path: "apps/react-party/src/components/3-component-composition/0-props/count-content.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/0-props/count-display.tsx"
                language: "tsx"
          - name: "Emit to Parent"
            description: "React components can communicate with their parent by calling functions passed as props."
            link: "https://react.dev/learn/responding-to-events#passing-event-handlers-as-props"
            file:
              - path: "apps/react-party/src/components/3-component-composition/1-emit-to-parent/count-action.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/1-emit-to-parent/count-content.tsx"
                language: "tsx"
          - name: "Slot"
            description: "React uses the children prop to implement slot-like functionality."
            link: "https://react.dev/learn/passing-props-to-a-component#passing-jsx-as-children"
            file:
              - path: "apps/react-party/src/components/3-component-composition/2-slot/button-content.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/2-slot/custom-button.tsx"
                language: "tsx"
          - name: "Slot Fallback"
            description: "In React, you can provide default content for slots using conditional rendering."
            link: "https://react.dev/learn/conditional-rendering"
            file:
              - path: "apps/react-party/src/components/3-component-composition/3-slot-fallback/app.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/3-slot-fallback/card.tsx"
                language: "tsx"
          - name: "Context"
            description: "React provides the Context API for passing data through the component tree without props."
            link: "https://react.dev/learn/passing-data-deeply-with-context"
            file:
              - path: "apps/react-party/src/components/3-component-composition/4-context/app-context.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/4-context/theme-context.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/3-component-composition/4-context/theme-toggle.tsx"
                language: "tsx"
      - <<: *form-input
        detail:
          - name: "Input Text"
            description: "React handles form inputs using controlled components with the value and onChange props."
            link: "https://react.dev/reference/react-dom/components/input"
            file:
              - path: "apps/react-party/src/components/4-form-input/0-input-text/input-text.tsx"
                language: "tsx"
          - name: "Checkbox"
            description: "Checkboxes in React are handled similarly to other form inputs, using the checked prop."
            link: "https://react.dev/reference/react-dom/components/input#checkbox"
            file:
              - path: "apps/react-party/src/components/4-form-input/1-checkbox/checkbox.tsx"
                language: "tsx"
          - name: "Radio"
            description: "Radio buttons in React are managed using the checked prop and onChange handler."
            link: "https://react.dev/reference/react-dom/components/input#radio"
            file:
              - path: "apps/react-party/src/components/4-form-input/2-radio/radio.tsx"
                language: "tsx"
          - name: "Select"
            description: "Select elements in React are created using the <select> and <option> tags with controlled component pattern."
            link: "https://react.dev/reference/react-dom/components/select"
            file:
              - path: "apps/react-party/src/components/4-form-input/3-select/select.tsx"
                language: "tsx"
      - <<: *webapp-features
        detail:
          - name: "Render App"
            description: "React applications are typically rendered using ReactDOM.createRoot().render()."
            link: "https://react.dev/reference/react-dom/client/createRoot"
            file:
              - path: "apps/react-party/index.html"
                language: "html"
              - path: "apps/react-party/src/main.tsx"
                language: "tsx"
              - path: "apps/react-party/src/components/5-webapp-features/0-render-app/app.tsx"
                language: "tsx"
          - name: "Fetch Data"
            description: "Data fetching in React can be done using the useEffect hook along with the Fetch API or libraries like Axios."
            link: "https://react.dev/learn/synchronizing-with-effects#fetching-data"
            file:
              - path: "apps/react-party/src/components/5-webapp-features/1-fetch-data/app.tsx"
                language: "tsx"

