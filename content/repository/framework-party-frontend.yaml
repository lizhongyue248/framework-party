    description: "A JavaScript library for building user interfaces with a component-based architecture."
    version: "18.2.0"
    repository: "https://github.com/facebook/react"
    website: "https://reactjs.org"
    license: "MIT"
    logo: "https://reactjs.org/logo-og.png"
    feature:
      - <<: *reactivity-group
        detail:
          - name: "Declaring State"
            description: "Use @RequestMapping to map web requests onto specific handler methods."
            file:
              - path: "apps/react-party/src/components/reactivity/DeclareState.tsx"
